<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arista Vault Performance Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1F1B24, #3E3B46);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .chart-container {
            width: 45%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>Arista Vault Performance Dashboard</h1>
    
    <div class="container">
        <div id="engagementChart" class="chart-container"></div>
        <div id="appVersionChart" class="chart-container"></div>
        <div id="deviceTypeChart" class="chart-container"></div>
        <div id="monthlyActiveUsersChart" class="chart-container"></div>
        <div id="alarmsChart" class="chart-container"></div>
        <div id="markAsLostChart" class="chart-container"></div>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/fetch-data');
                const data = await response.json();
                if (data.error) {
                    console.error('Error fetching data:', data.error);
                    return;
                }
                generateDashboard(data);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function generateDashboard(data) {
            let totalConnections = 0;
            let totalDisconnections = 0;
            let appVersions = {};
            let deviceTypes = {};
            let monthlyUsers = {};
            let totalMobileAlarms = 0;
            let totalStartAlarms = 0;
            let totalStopAlarms = 0;
            let totalMarkAsLost = 0;
            let totalRevokeMarkAsLost = 0;

            Object.values(data).forEach(user => {
                Object.values(user.devices).forEach(device => {
                    totalConnections += device.connectedCount || 0;
                    totalDisconnections += device.disconnectedCount || 0;
                    let version = device.appVersion || "undefined";
                    appVersions[version] = (appVersions[version] || 0) + 1;
                    let type = device.deviceType || "Unknown";
                    deviceTypes[type] = (deviceTypes[type] || 0) + 1;
                    
                    let createdDate = new Date(device.createdAt);
                    let monthYear = createdDate.toLocaleString('default', { month: 'short', year: 'numeric' });
                    monthlyUsers[monthYear] = (monthlyUsers[monthYear] || 0) + 1;
                    
                    totalMobileAlarms += device.mobileAlarmCount || 0;
                    totalStartAlarms += device.startAlarmCount || 0;
                    totalStopAlarms += device.stopAlarmCount || 0;
                    totalMarkAsLost += device.markAsLostCount || 0;
                    totalRevokeMarkAsLost += device.revokeMarkAsLostCount || 0;
                });
            });

            Plotly.newPlot('engagementChart', [{ x: ['Connections', 'Disconnections'], y: [totalConnections, totalDisconnections], type: 'bar', marker: { color: ['#34eb83', '#eb4034'] } }], { title: 'Connections vs Disconnections' });
            Plotly.newPlot('appVersionChart', [{ labels: Object.keys(appVersions), values: Object.values(appVersions), type: 'pie' }], { title: 'App Version Distribution' });
            Plotly.newPlot('deviceTypeChart', [{ labels: Object.keys(deviceTypes), values: Object.values(deviceTypes), type: 'pie' }], { title: 'Device Type Distribution' });
            Plotly.newPlot('monthlyActiveUsersChart', [{ x: Object.keys(monthlyUsers), y: Object.values(monthlyUsers), type: 'scatter', mode: 'lines+markers' }], { title: 'Monthly Active Users' });
            Plotly.newPlot('alarmsChart', [{ x: ['Mobile Alarms', 'Start Alarms', 'Stop Alarms'], y: [totalMobileAlarms, totalStartAlarms, totalStopAlarms], type: 'bar', marker: { color: ['#ffcc00', '#ff6666', '#66ccff'] } }], { title: 'Alarms Distribution' });
            Plotly.newPlot('markAsLostChart', [{ x: ['Mark as Lost', 'Revoke Mark as Lost'], y: [totalMarkAsLost, totalRevokeMarkAsLost], type: 'bar', marker: { color: ['#ff5733', '#33ff57'] } }], { title: 'Mark as Lost vs Revoke Mark as Lost' });
        }

        fetchData();
    </script>
</body>
</html>
